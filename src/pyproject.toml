[project]
name = "hack-py-ton"
version = "0.0.1"
requires-python = "==3.9.21"
dependencies = [
    "celery",
    "django-environ",
    "django-extensions",
    "django-model-utils",
    "django-taggit",
    "djangorestframework",
    "ipython",
    "lxml",
    "python-magic",
    "requests",
    "sentry-sdk",
    "tldextract",
    "url-normalize",
]

[dependency-groups]
dev = [
    "django-capture-on-commit-callbacks",
    "django-debug-toolbar",
    "factory-boy",
    "freezegun",
    "parameterized",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-randomness",
    "pytest-xdist",
    "responses",
]

[tool.coverage.run]
branch = true
source = [
  ".",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "typing.TYPE_CHECKING",
  "^\\s*pass\\s*$",
]
skip_covered = true
omit = [
  "*/admin.py",
  "*/migrations/*",
]
[tool.pytest]
addopts = [
  "--fail-on-template-vars",
  "--reuse-db",
]
junit_family = "legacy"
