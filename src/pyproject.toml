[project]
name = "hack-py-ton"
version = "0.0.1"
requires-python = ">=3.13,<4.0"
dependencies = [
    "celery>=5.5.1",
    "django==4.0",
    "django-environ>=0.12.0",
    "django-extensions>=3.2.3",
    "django-model-utils>=5.0.0",
    "django-taggit>=4.0.0",
    "djangorestframework>=3.15.1",
    "ipython>=9.1.0",
    "lxml>=5.3.2",
    "python-magic>=0.4.27",
    "requests>=2.32.3",
    "sentry-sdk>=2.25.1",
    "tldextract>=5.2.0",
    "url-normalize>=2.2.0",
]

[dependency-groups]
dev = [
    "django-capture-on-commit-callbacks>=1.11.0",
    "django-debug-toolbar>=4.3.0",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.1",
    "parameterized>=0.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-django>=4.11.1",
    "pytest-randomness>=0.1.0",
    "pytest-xdist>=3.6.1",
    "responses>=0.25.7",
]

[tool.coverage.run]
branch = true
source = [
  ".",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "typing.TYPE_CHECKING",
  "^\\s*pass\\s*$",
]
skip_covered = true
omit = [
  "*/admin.py",
  "*/migrations/*",
]
[tool.pytest]
addopts = [
  "--fail-on-template-vars",
  "--reuse-db",
]
junit_family = "legacy"
